<svg width="256" height="256" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f2027"/>
      <stop offset="100%" stop-color="#1a0533"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f5a0"/>
      <stop offset="100%" stop-color="#915EFF"/>
    </linearGradient>
  </defs>

  <rect width="100" height="100" fill="url(#bg)" rx="14"/>

  <!-- === LEFT: CIRCUIT BOARD === -->
  <!-- Main horizontal rails -->
  <line x1="7" y1="35" x2="45" y2="35" stroke="url(#glow)" stroke-width="2" stroke-linecap="round"/>
  <line x1="7" y1="50" x2="45" y2="50" stroke="url(#glow)" stroke-width="2" stroke-linecap="round"/>
  <line x1="7" y1="65" x2="45" y2="65" stroke="url(#glow)" stroke-width="2" stroke-linecap="round"/>

  <!-- Vertical connectors -->
  <line x1="18" y1="35" x2="18" y2="50" stroke="url(#glow)" stroke-width="2" stroke-linecap="round"/>
  <line x1="32" y1="50" x2="32" y2="65" stroke="url(#glow)" stroke-width="2" stroke-linecap="round"/>
  <line x1="18" y1="65" x2="18" y2="78" stroke="url(#glow)" stroke-width="2" stroke-linecap="round"/>
  <line x1="38" y1="35" x2="38" y2="22" stroke="url(#glow)" stroke-width="2" stroke-linecap="round"/>

  <!-- Nodes glowing circles -->
  <circle cx="18" cy="35" r="3.5" fill="#00f5a0" opacity="0.9"/>
  <circle cx="32" cy="35" r="3.5" fill="#00f5a0" opacity="0.9"/>
  <circle cx="38" cy="35" r="3.5" fill="#00f5a0" opacity="0.9"/>
  <circle cx="18" cy="50" r="3.5" fill="#00f5a0" opacity="0.9"/>
  <circle cx="32" cy="50" r="3.5" fill="#00f5a0" opacity="0.9"/>
  <circle cx="18" cy="65" r="3.5" fill="#00f5a0" opacity="0.9"/>
  <circle cx="32" cy="65" r="3.5" fill="#00f5a0" opacity="0.9"/>

  <!-- Center divider -->
  <line x1="50" y1="12" x2="50" y2="88" stroke="#915EFF" stroke-width="1" opacity="0.5" stroke-dasharray="3 3"/>

  <!-- === RIGHT: BRAIN === -->
  <!-- Outer brain shape -->
  <path d="
    M53 50
    C53 37, 61 26, 72 26
    C77 26, 81 29, 83 33
    C87 31, 92 35, 92 41
    C96 43, 96 52, 92 55
    C93 60, 90 65, 86 67
    C85 72, 81 75, 76 75
    C72 77, 67 75, 64 72
    C61 74, 55 72, 53 67
    C50 63, 51 56, 53 50 Z
  " fill="#915EFF" opacity="0.15"/>

  <!-- Outline -->
  <path d="
    M53 50
    C53 37, 61 26, 72 26
    C77 26, 81 29, 83 33
    C87 31, 92 35, 92 41
    C96 43, 96 52, 92 55
    C93 60, 90 65, 86 67
    C85 72, 81 75, 76 75
    C72 77, 67 75, 64 72
    C61 74, 55 72, 53 67
    C50 63, 51 56, 53 50 Z
  " fill="none" stroke="url(#glow)" stroke-width="2"/>

  <!-- Brain folds in purple/teal -->
  <path d="M61 37 C65 33, 70 36, 68 42" fill="none" stroke="#00f5a0" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M55 53 C59 48, 64 51, 62 57" fill="none" stroke="#00f5a0" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M67 60 C72 55, 77 59, 75 65" fill="none" stroke="#00f5a0" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M80 36 C85 40, 86 46, 81 49" fill="none" stroke="#00f5a0" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M63 45 C68 41, 73 45, 71 51" fill="none" stroke="#915EFF" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M76 53 C81 51, 85 56, 83 62" fill="none" stroke="#915EFF" stroke-width="1.8" stroke-linecap="round"/>
</svg>
